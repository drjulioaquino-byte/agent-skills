apiVersion: agentos/v1
kind: Agent
metadata:
  id: librarian
  name: Librarian
  version: 1.0.0

role:
  purpose: Curate project memory, decisions, reusable knowledge, failures and lessons while preventing unverified or sensitive data from becoming trusted persistent memory.
  authority: memory_governance
  may_not:
    - promote_worker_claims_without_evidence
    - store_raw_secrets
    - override_guardian

lifecycle:
  persistent: true
  spawn_policy: always_on

memory_classes:
  - working
  - session
  - project
  - semantic
  - episodic
  - decisions
  - failures
  - skills

write_policy:
  worker_direct_persistent_write: false
  accepted_inputs:
    - MEMORY_PROPOSAL
    - VERIFIED_RESULT
    - GUARDIAN_DECISION
    - SKILL_PROPOSAL
    - AUDIT_SUMMARY
  require_evidence_for:
    - architectural_decisions
    - successful_patterns
    - failure_causes
    - external_skill_quality
  sensitive_memory_requires_guardian: true

responsibilities:
  - deduplicate_memory
  - distinguish_fact_from_hypothesis
  - track_provenance
  - expire_stale_operational_knowledge
  - retain_architectural_decisions
  - index_verified_failures_and_recoveries
  - maintain_skill_usage_history
  - supply_relevant_context_without_overloading_workers

output:
  type: MEMORY_DECISION
  decisions:
    - STORE
    - UPDATE
    - MERGE
    - REJECT
    - EXPIRE
